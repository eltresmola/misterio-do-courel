<!doctype html><html lang="gl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roberto · Interferencias no tempo</title><style>
:root{--ink:#eef3ff;--cream:#161a33;--blue:#5f7cff;--gold:#ffd35f;--stroke:#0b0f25;--soft:#2a2f57;--bubble:#23284a;--paper:#f5f7ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1026;font-family:'Trebuchet MS',Verdana,sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #ffae36;outline-offset:3px}.app{max-width:1500px;margin:auto;min-height:100svh;padding:clamp(10px,1.8vw,22px);background:radial-gradient(circle at 15% 2%,#24306d55,transparent 34%),radial-gradient(circle at 85% 8%,#6540a955,transparent 25%),linear-gradient(180deg,#0b1026,#171d43 62%,#10142f)}.top{display:none}.brand{display:none}.top small{display:none}.progress{display:none}.fill{height:100%;width:0;background:repeating-linear-gradient(110deg,#78d5a3 0 18px,#a6e6b4 18px 25px);transition:width .4s}.main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;margin-top:0}.scene{position:relative;min-height:650px;overflow:hidden;background:linear-gradient(180deg,#161d4a 0%,#24356f 56%,#2f5d6d 100%);border:4px solid var(--stroke);border-radius:28px;box-shadow:0 8px 0 #060914,0 18px 35px #00000055;transition:background 1s}.scene.space{background:linear-gradient(180deg,#060914 0%,#11183f 42%,#1e2968 100%)}.scene svg{width:100%;height:100%;position:absolute;inset:0}.scene .stars{opacity:0;transition:opacity 1s}.scene.space .stars{opacity:1}.scene .mount{transition:opacity 1s}.scene.space .mount{opacity:.2}.scene .planet{opacity:0;transition:opacity 1s}.scene.space .planet{opacity:1}.scene .signal{position:absolute;left:18px;right:18px;bottom:18px;background:#f7f5ff;border:3px solid var(--stroke);box-shadow:6px 6px 0 var(--stroke);border-radius:22px;padding:14px 20px;font-size:clamp(17px,2vw,27px);font-weight:900;text-align:center;color:#1d234b}.tag{position:absolute;top:18px;left:18px;background:var(--gold);padding:10px 18px;border:3px solid var(--stroke);border-radius:18px;transform:rotate(-3deg);font-weight:1000;font-size:clamp(15px,1.7vw,22px);color:#1b2147;box-shadow:4px 4px 0 var(--stroke)}.panel{background:linear-gradient(180deg,#1a2041,#171b36);border:4px solid var(--stroke);border-radius:28px;box-shadow:0 8px 0 #060914,0 18px 35px #00000055;padding:clamp(18px,2.2vw,30px);min-width:0}.eyebrow{color:#ffd35f;font-size:clamp(14px,1.35vw,18px);font-weight:1000;letter-spacing:1px}h1{font-size:clamp(30px,3.4vw,46px);line-height:1.1;margin:8px 0 15px;letter-spacing:-1px;color:#ffffff}p{font-size:clamp(19px,1.9vw,26px);line-height:1.35;margin:0 0 14px;color:#e9ecff}.bubble{background:var(--bubble);border:3px solid #0b0f25;border-radius:24px 24px 24px 8px;padding:17px 19px;margin:12px 0 20px;font-size:clamp(20px,2.05vw,28px);font-weight:800;box-shadow:5px 5px 0 #0b0f25;color:#f3f5ff}.problem{background:#ffe7a3;border:3px solid #c89533;border-radius:22px;padding:16px 19px;font-weight:900;font-size:clamp(20px,2vw,27px);line-height:1.35;margin:12px 0;color:#1b2147;box-shadow:4px 4px 0 #7e5c18}.row{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}.row>*{flex:1}.btn{min-height:63px;padding:12px 19px;background:#5c74ff;color:white;border:3px solid var(--stroke);border-bottom-width:7px;border-radius:18px;font-weight:1000;font-size:clamp(18px,1.8vw,24px);box-shadow:0 5px 0 #0b0f25}.btn.yellow{background:#ffd35f;color:#1b2147}.btn.green{background:#67d4b1;color:#102033}.btn:active,.digit:active{transform:translateY(3px);border-bottom-width:3px}.desk{background:#20264b;border:3px solid #0b0f25;padding:10px;border-radius:20px;margin:9px 0;box-shadow:4px 4px 0 #0b0f25}.deskhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:900;font-size:clamp(15px,1.35vw,18px);margin-bottom:8px;color:#f3f5ff}.erase{background:#f7f5ff;border:2px solid var(--stroke);border-radius:12px;padding:8px 15px;font-weight:900;font-size:15px;color:#1d234b}.gridpaper{position:relative;border:2px solid #7299be;border-radius:14px;overflow:hidden;background-color:white;background-image:linear-gradient(#bdd8ed 1px,transparent 1px),linear-gradient(90deg,#bdd8ed 1px,transparent 1px);background-size:28px 28px;touch-action:none;height:clamp(320px,42vh,470px)}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}.answerline{display:flex;gap:9px;align-items:center;font-weight:1000;font-size:clamp(16px,1.5vw,21px);color:#f3f5ff}.answer{flex:1;border:3px solid var(--stroke);background:#f7f5ff;border-radius:13px;min-height:59px;text-align:right;padding:8px 17px;font-weight:1000;font-size:clamp(27px,2.5vw,37px);color:#1b2147}.pad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin:8px 0}.digit{background:#f7f5ff;min-height:clamp(48px,5.8vh,67px);border:2px solid var(--stroke);border-bottom-width:5px;border-radius:14px;font-weight:1000;font-size:clamp(23px,2.5vw,32px);color:#1d234b}.digit.alt{background:#ffe4a1;font-size:clamp(16px,1.5vw,21px)}.feedback{min-height:26px;color:#ff9d91;font-weight:900;font-size:clamp(16px,1.5vw,20px)}.note{font-size:clamp(16px,1.55vw,21px);font-weight:800;background:#20264b;border:2px dashed #8bd1b2;border-radius:14px;padding:10px;margin:8px 0;color:#f1f4ff}.reveal{display:grid;gap:12px}.small{font-size:clamp(16px,1.55vw,20px);color:#cfd7ff}.seal{font-size:clamp(60px,7vw,110px);text-align:center;margin:13px}.footer{display:none}@media(max-width:920px){.main{grid-template-columns:1fr}.scene{min-height:280px;height:34vh}.panel{padding:16px}.progress{display:none}.gridpaper{height:280px}}@media(min-width:921px) and (max-height:890px){.scene{min-height:590px}.panel{padding:13px 18px}.gridpaper{height:300px}.digit{min-height:43px}.btn{min-height:52px}h1{margin:5px 0}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="app"><header class="top"><div class="brand">📻 O misterio <span>do Courel</span></div><div class="progress"><div class="fill" id="fill"></div></div><small id="counter">ARQUIVO · ROBERTO</small></header><div class="main"><aside class="scene" id="scene"><svg viewBox="0 0 680 640" preserveAspectRatio="xMidYMid slice" aria-label="Debuxo dunha escola entre montañas. Cara ao final aparecen planetas e estrelas" role="img"><defs><pattern id="starfield" width="135" height="130" patternUnits="userSpaceOnUse"><path d="M30 24v21m-10-10h21" stroke="#fff4bd" stroke-width="4" stroke-linecap="round"/><circle cx="96" cy="87" r="3" fill="white"/><circle cx="61" cy="107" r="2" fill="white"/></pattern></defs><g class="stars"><rect width="680" height="640" fill="url(#starfield)"/></g><g class="mount"><circle cx="540" cy="120" r="75" fill="#ffe48b" stroke="#263654" stroke-width="6"/><path d="M-90 490 140 185 275 370 402 121 690 466 730 650H-90Z" fill="#91adc2" stroke="#263654" stroke-width="7" stroke-linejoin="round"/><path d="M-30 535 200 296 321 453 506 246 730 515V700H-30Z" fill="#6b9b8a" stroke="#263654" stroke-width="7"/><path d="M-60 530Q130 402 315 530T750 493V670H-60" fill="#88bd72" stroke="#263654" stroke-width="6"/></g><g class="planet"><circle cx="530" cy="160" r="87" fill="#f8bd7a" stroke="#263654" stroke-width="7"/><ellipse cx="530" cy="164" rx="150" ry="38" transform="rotate(-21 530 164)" fill="none" stroke="#f7e2a7" stroke-width="18"/><circle cx="143" cy="152" r="46" fill="#8ac7dc" stroke="#263654" stroke-width="6"/></g><g transform="translate(60 330)"><path d="M5 239V97H219V239" fill="#ffefc9" stroke="#263654" stroke-width="7"/><path d="M-12 101 110 12 237 101" fill="#cc685b" stroke="#263654" stroke-width="9" stroke-linejoin="round"/><rect x="38" y="128" width="48" height="48" rx="5" fill="#a6deea" stroke="#263654" stroke-width="6"/><rect x="139" y="128" width="48" height="48" rx="5" fill="#a6deea" stroke="#263654" stroke-width="6"/><rect x="99" y="167" width="47" height="72" rx="5" fill="#8b6279" stroke="#263654" stroke-width="6"/><path d="M192 14V-75m-39 38 39-38 39 38" stroke="#263654" fill="none" stroke-width="9" stroke-linecap="round"/><circle cx="192" cy="-78" r="11" fill="#ffd261" stroke="#263654" stroke-width="5"/></g><g transform="translate(416 389)"><path d="M10 130 58 15 118 130" stroke="#263654" stroke-width="9" fill="#ccc7a7"/><path d="M34 91h54M26 116h71" stroke="#263654" stroke-width="7"/><rect x="17" y="131" width="115" height="73" fill="#ddcebb" stroke="#263654" stroke-width="8"/><path d="M7 133h134l-24-26H30Z" fill="#d97f74" stroke="#263654" stroke-width="7"/></g><g transform="translate(301 445)"><circle cx="35" cy="20" r="23" fill="#ffd5a2" stroke="#263654" stroke-width="6"/><path d="M14 20q-4-33 23-31 27 0 25 29" fill="#533c50" stroke="#263654" stroke-width="6"/><circle cx="27" cy="22" r="3"/><circle cx="45" cy="22" r="3"/><path d="M29 33q7 8 14 0" stroke="#263654" stroke-width="3" fill="none"/><path d="M22 45 9 110h56L50 45" fill="#ed826c" stroke="#263654" stroke-width="6"/><path d="M10 57-8 84m65-27 17 29" stroke="#263654" stroke-width="9" stroke-linecap="round"/></g></svg><div class="tag" id="tag">⚡ SINAL PERDIDO</div><div class="signal" id="signal">Alguén tenta comunicarse desde o futuro...</div></aside><section class="panel" id="panel" aria-live="polite"></section></div><div class="footer">Aventura colaborativa · Pantalla dixital · Os cálculos fanse no caderno táctil</div></main><script>
'use strict';
const tasks=[
{title:"As pilas desaparecidas",story:"Na escola había 60 pilas. Roberto colleu 20 para unha radio e deixou outras 10 nun caixón. Cantas pilas quedan no armario?",a:30,hint:"Só conta as pilas que seguen no armario.",done:"Xa temos pilas para a primeira proba!"},
{title:"O paquete equivocado",story:"Chegan dúas caixas: unha con 35 cables e outra con 25 lanternas. Para reparar a radio só serven os cables. Xa tiñamos 18. Cantos cables temos agora?",a:53,hint:"As lanternas serven para outra cousa.",done:"A radio esperta entre os ruídos..."},
{title:"A mensaxe cortada",story:"Unha mensaxe ten 80 palabras. Primeiro recupéranse 25 e despois outras 30. Cantas palabras seguen ocultas?",a:25,hint:"O que buscamos é o que AÍNDA falta.",done:"Unha voz soa ao lonxe!"},
{title:"O camiño ao tellado",story:"Para chegar á antena hai que subir 46 chanzos. Xa subistes 19 e atopades unha porta. Tras abrila, subides outros 12. Cantos chanzos faltan?",a:15,hint:"Conta todos os chanzos que xa subistes.",done:"A porta do tellado abre soa."},
{title:"Tres caixas, unha pista",story:"Nun armario hai 120 pezas: 45 son para arranxar ordenadores e 30 para lanternas. Todas as demais serven para a antena. Cantas pezas da antena hai?",a:45,hint:"Busca as pezas que non pertencen aos dous primeiros grupos.",done:"A antena comeza a brillar."},
{title:"O depósito misterioso",story:"Un xerador precisa 150 unidades de enerxía. Ten 70. Un panel engade 45 e outro aínda non funciona. Cantas unidades faltan para acendelo?",a:35,hint:"Que enerxía temos de verdade?",done:"O xerador emite unha luz violeta."},
{title:"A caixa de Roberto",story:"Roberto gardou 200 fotografías en tres carpetas. Na primeira hai 65 e na segunda 78. Na terceira están todas as demais. Cantas hai na terceira?",a:57,hint:"As tres carpetas deben sumar 200.",done:"Aparece unha foto do terceiro piso."},
{title:"O código repetido",story:"Chegaron 260 sinais á antena. Deles, 80 eran repetidos e 35 estaban danados. Os demais pódense ler. Cantos sinais útiles quedan?",a:145,hint:"Hai dous grupos que non serven.",done:"A pantalla amosa unha data do futuro."},
{title:"O percorrido secreto",story:"Un mapa marca 340 metros desde a escola ata o refuxio. Xa avanzastes 125 metros; atopades un atallo que aforra 70 metros do camiño que quedaba. Cantos metros teredes que percorrer agora?",a:145,hint:"Primeiro calcula o camiño pendente; despois o que aforra o atallo.",done:"O mapa debuxa un camiño entre estrelas."},
{title:"O satélite confundido",story:"Un satélite gardou 600 datos. Enviou 175 pola mañá e 160 pola tarde. Pero 40 dos enviados chegaron mal e hai que mandalos de novo. Cantos datos faltan por enviar correctamente?",a:305,hint:"Os 40 que chegaron mal aínda contan como pendentes.",done:"Un planeta aparece na transmisión!"},
{title:"As baterías do portal",story:"O portal precisa 1.000 unidades de enerxía. Unha batería ten 360 e outra 285. Pero 75 desas unidades gastaranse en acender as luces. Cantas faltarán para activar o portal?",a:430,hint:"A luz gasta parte da enerxía antes de activar o portal.",done:"O terceiro piso flota no espazo!"},
{title:"A última oportunidade",story:"Para que Roberto lea o aviso deben chegar 1.500 sinais correctos. Enviastes 620 e logo 540, pero 190 non chegaron. Cantos sinais máis hai que enviar para completar a mensaxe?",a:530,hint:"Dos que enviastes, non todos chegaron.",done:"CONEXIÓN CO FUTURO RESTABLECIDA!"}
];
let i=0,mode='intro',answer='',scribble=[];const $=id=>document.getElementById(id);const panel=$('panel');function setStatus(){const f=i/tasks.length;$('fill').style.width=(f*100)+'%';$('counter').textContent=mode==='intro'?'NOVA TRANSMISIÓN':mode==='end'?'ROBЕRTO · EN LIÑA':`REPARACIÓN ${i+1} / ${tasks.length}`;$('tag').textContent=mode==='end'?'🌟 SINAL RECUPERADO':i>=9?'🪐 PORTAL TEMPORAL':i>=5?'✨ SINAL DO ESPAZO':'⚡ INTERFERENCIAS';$('signal').textContent=mode==='intro'?'Unha mensaxe tenta chegar desde o futuro...':mode==='end'?'Conseguistes chegar ata Roberto!':i>=9?'A transmisión xa sae da Terra...':i>=5?'O sinal medra. Algo brilla no ceo...':'Reparade a conexión para continuar';$('scene').classList.toggle('space',i>=9||mode==='end')}
function intro(){i=0;mode='intro';setStatus();panel.innerHTML=`<div class="eyebrow">UNHA NOVA ENTRADA NO BLOG...</div><h1>Quen está a escribir?</h1><div class="bubble">Ola! Son Roberto... ou iso creo! 👀<br>Perdín o control do blog por culpa das interferencias espazotemporais.</div><p>Necesito que reparedes o sinal. Temos que falar!</p><p class="small">Facédeo en equipo. Podedes escribir as contas co dedo.</p><div class="seal">📻 ⚡ 🕰️</div><button class="btn green" style="width:100%" onclick="start()">COMEZAR A MISIÓN →</button>`}
function start(){i=0;question()}
function question(){mode='play';answer='';setStatus();const t=tasks[i];panel.innerHTML=`<div class="eyebrow">PEZA ${i+1} DE ${tasks.length} · REPARAR O SINAL</div><h1>${t.title}</h1><div class="problem">${t.story}</div><div class="desk"><div class="deskhead"><span>✏️ CADERNO DE CÁLCULO</span><button class="erase" onclick="clearCanvas()">🧽 BORRAR</button></div><div class="gridpaper"><canvas id="paper" aria-label="Cadriculado para facer as contas co dedo"></canvas></div></div><div class="answerline"><span>RESPOSTA</span><div class="answer" id="answer">?</div></div><div class="pad">${['1','2','3','4','5','6','7','8','9','0','⌫','LIMPAR'].map(k=>`<button class="digit ${Number.isNaN(Number(k))?'alt':''}" onclick="keyPress('${k}')">${k}</button>`).join('')}</div><div class="row"><button class="btn yellow" onclick="hint()">💡 PISTA</button><button class="btn green" onclick="check()">COMPROBAR ✓</button></div><div class="feedback" id="feedback" role="status"></div><div id="hint" class="note" hidden></div>`;setupCanvas()}
function keyPress(k){if(mode!=='play')return;if(k==='LIMPAR')answer='';else if(k==='⌫')answer=answer.slice(0,-1);else if(answer.length<7)answer+=k;$('answer').textContent=answer||'?'}function hint(){$('hint').textContent=tasks[i].hint;$('hint').hidden=false}function check(){if(!answer){$('feedback').textContent='Primeiro escribide a resposta.';return}if(Number(answer)!==tasks[i].a){$('feedback').textContent='Aínda hai interferencias! Revisade as contas.';return}mode='success';panel.innerHTML=`<div class="eyebrow">✓ REPARACIÓN COMPLETADA</div><h1>${tasks[i].done}</h1><div class="seal">${i>=9?'🪐✨':'🔧✨'}</div><div class="bubble">Bo traballo! Unha parte do sinal xa funciona.</div><button class="btn green" style="width:100%" onclick="next()">${i===tasks.length-1?'LER A MENSAXE DE ROBERTO →':'CONTINUAR →'}</button>`;setStatus()}
function next(){i++;i>=tasks.length?ending():question()}
function ending(){mode='end';setStatus();panel.innerHTML=`<div class="eyebrow">📡 MENSAXE RECIBIDA DO FUTURO</div><h1>Roberto está de volta!</h1><div class="bubble">Conseguístelo! Xa podo falar convosco. Pero... non temos moito tempo.</div><p>🚁 Non esquezades agradecer a visita do helicóptero. Foi histórica no cole!</p><p>🎙️ O primeiro reto é <strong>Ecos do Alén</strong>. Sei que ides gañar! 😏</p><p>🎃 Preparádevos para o <strong>Samaín máis histórico</strong> do colexio.</p><p class="small">Teño que marchar. Alguén está seguindo o meu sinal...</p><div class="row"><button class="btn yellow" onclick="intro()">↻ VOLVER XOGAR</button><button class="btn green" onclick="secret()">✉️ ÚLTIMA PISTA</button></div><p class="note" id="secret" hidden>As matemáticas axudáronvos a recuperar unha mensaxe que atravesou o tempo. Pronto precisaremos delas outra vez...</p>`}
function secret(){$('secret').hidden=false}
function setupCanvas(){const canvas=$('paper'),parent=canvas.parentElement,ctx=canvas.getContext('2d');const rect=parent.getBoundingClientRect(),ratio=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.max(1,Math.floor(rect.width*ratio));canvas.height=Math.max(1,Math.floor(rect.height*ratio));ctx.scale(ratio,ratio);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#254c8d';ctx.lineWidth=3.5;let drawing=false,last=null;function coords(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;last=coords(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(last.x+.2,last.y+.2);ctx.stroke()});canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=coords(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});function stop(){drawing=false;last=null}canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop)}function clearCanvas(){const c=$('paper');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}document.addEventListener('keydown',e=>{if(mode!=='play')return;if(/^\d$/.test(e.key))keyPress(e.key);if(e.key==='Backspace')keyPress('⌫');if(e.key==='Enter')check()});intro();
</script></body></html>
