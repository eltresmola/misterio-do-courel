<!doctype html><html lang="gl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roberto · Interferencias no tempo</title><style>
:root{--ink:#eef3ff;--cream:#161a33;--blue:#5f7cff;--gold:#ffd35f;--stroke:#0b0f25;--soft:#2a2f57;--bubble:#23284a;--paper:#f5f7ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1026;font-family:'Trebuchet MS',Verdana,sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #ffae36;outline-offset:3px}.app{max-width:1500px;margin:auto;min-height:100svh;padding:clamp(10px,1.8vw,22px);background:radial-gradient(circle at 15% 2%,#24306d55,transparent 34%),radial-gradient(circle at 85% 8%,#6540a955,transparent 25%),linear-gradient(180deg,#0b1026,#171d43 62%,#10142f)}.top{display:none}.brand{display:none}.top small{display:none}.progress{display:none}.fill{height:100%;width:0;background:repeating-linear-gradient(110deg,#78d5a3 0 18px,#a6e6b4 18px 25px);transition:width .4s}.main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;margin-top:0}.scene{position:relative;min-height:650px;overflow:hidden;background:linear-gradient(180deg,#161d4a 0%,#24356f 56%,#2f5d6d 100%);border:4px solid var(--stroke);border-radius:28px;box-shadow:0 8px 0 #060914,0 18px 35px #00000055;transition:background 1s}.scene.space{background:linear-gradient(180deg,#060914 0%,#11183f 42%,#1e2968 100%)}.scene svg{width:100%;height:100%;position:absolute;inset:0}.scene .stars{opacity:0;transition:opacity 1s}.scene.space .stars{opacity:1}.scene .mount{transition:opacity 1s}.scene.space .mount{opacity:.2}.scene .planet{opacity:0;transition:opacity 1s}.scene.space .planet{opacity:1}.scene .signal{position:absolute;left:18px;right:18px;bottom:18px;background:#f7f5ff;border:3px solid var(--stroke);box-shadow:6px 6px 0 var(--stroke);border-radius:22px;padding:14px 20px;font-size:clamp(17px,2vw,27px);font-weight:900;text-align:center;color:#1d234b}.tag{position:absolute;top:18px;left:18px;background:var(--gold);padding:10px 18px;border:3px solid var(--stroke);border-radius:18px;transform:rot 'use strict';
const tasks=[
{title:"As pilas desaparecidas",story:"Na escola había 60 pilas. Roberto colleu 20 para unha radio e deixou outras 10 nun caixón. Cantas pilas quedan no armario?",a:30,hint:"Só conta as pilas que seguen no armario.",done:"Xa temos pilas para a primeira proba!"},
{title:"O paquete equivocado",story:"Chegan dúas caixas: unha con 35 cables e outra con 25 lanternas. Para reparar a radio só serven os cables. Xa tiñamos 18. Cantos cables temos agora?",a:53,hint:"As lanternas serven para outra cousa.",done:"A radio esperta entre os ruídos..."},
{title:"A mensaxe cortada",story:"Unha mensaxe ten 80 palabras. Primeiro recupéranse 25 e despois outras 30. Cantas palabras seguen ocultas?",a:25,hint:"O que buscamos é o que AÍNDA falta.",done:"Unha voz soa ao lonxe!"},
{title:"O camiño ao tellado",story:"Para chegar á antena hai que subir 46 chanzos. Xa subistes 19 e atopades unha porta. Tras abrila, subides outros 12. Cantos chanzos faltan?",a:15,hint:"Conta todos os chanzos que xa subistes.",done:"A porta do tellado abre soa."},
{title:"Tres caixas, unha pista",story:"Nun armario hai 120 pezas: 45 son para arranxar ordenadores e 30 para lanternas. Todas as demais serven para a antena. Cantas pezas da antena hai?",a:45,hint:"Busca as pezas que non pertencen aos dous primeiros grupos.",done:"A antena comeza a brillar."},
{title:"O depósito misterioso",story:"Un xerador precisa 150 unidades de enerxía. Ten 70. Un panel engade 45 e outro aínda non funciona. Cantas unidades faltan para acendelo?",a:35,hint:"Que enerxía temos de verdade?",done:"O xerador emite unha luz violeta."},
{title:"A caixa de Roberto",story:"Roberto gardou 200 fotografías en tres carpetas. Na primeira hai 65 e na segunda 78. Na terceira están todas as demais. Cantas hai na terceira?",a:57,hint:"As tres carpetas deben sumar 200.",done:"Aparece unha foto do terceiro piso."},
{title:"O código repetido",story:"Chegaron 260 sinais á antena. Deles, 80 eran repetidos e 35 estaban danados. Os demais pódense ler. Cantos sinais útiles quedan?",a:145,hint:"Hai dous grupos que non serven.",done:"A pantalla amosa unha data do futuro."},
{title:"O percorrido secreto",story:"Un mapa marca 340 metros desde a escola ata o refuxio. Xa avanzastes 125 metros; atopades un atallo que aforra 70 metros do camiño que quedaba. Cantos metros teredes que percorrer agora?",a:145,hint:"Primeiro calcula o camiño pendente; despois o que aforra o atallo.",done:"O mapa debuxa un camiño entre estrelas."},
{title:"O satélite confundido",story:"Un satélite gardou 600 datos. Enviou 175 pola mañá e 160 pola tarde. Pero 40 dos enviados chegaron mal e hai que mandalos de novo. Cantos datos faltan por enviar correctamente?",a:305,hint:"Os 40 que chegaron mal aínda contan como pendentes.",done:"Un planeta aparece na transmisión!"},
{title:"As baterías do portal",story:"O portal precisa 1.000 unidades de enerxía. Unha batería ten 360 e outra 285. Pero 75 desas unidades gastaranse en acender as luces. Cantas faltarán para activar o portal?",a:430,hint:"A luz gasta parte da enerxía antes de activar o portal.",done:"O terceiro piso flota no espazo!"},
{title:"A última oportunidade",story:"Para que Roberto lea o aviso deben chegar 1.500 sinais correctos. Enviastes 620 e logo 540, pero 190 non chegaron. Cantos sinais máis hai que enviar para completar a mensaxe?",a:530,hint:"Dos que enviastes, non todos chegaron.",done:"CONEXIÓN CO FUTURO RESTABLECIDA!"}
];
let i=0,mode='intro',answer='',scribble=[];const $=id=>document.getElementById(id);const panel=$('panel');function setStatus(){const f=i/tasks.length;$('fill').style.width=(f*100)+'%';$('counter').textContent=mode==='intro'?'NOVA TRANSMISIÓN':mode==='end'?'ROBЕRTO · EN LIÑA':`REPARACIÓN ${i+1} / ${tasks.length}`;$('tag').textContent=mode==='end'?'🌟 SINAL RECUPERADO':i>=9?'🪐 PORTAL TEMPORAL':i>=5?'✨ SINAL DO ESPAZO':'⚡ INTERFERENCIAS';$('signal').textContent=mode==='intro'?'Unha mensaxe tenta chegar desde o futuro...':mode==='end'?'Conseguistes chegar ata Roberto!':i>=9?'A transmisión xa sae da Terra...':i>=5?'O sinal medra. Algo brilla no ceo...':'Reparade a conexión para continuar';$('scene').classList.toggle('space',i>=8||mode==='end');$('scene').style.setProperty('--space-phase',i>=8?'1':'0')}
function intro(){i=0;mode='intro';setStatus();panel.innerHTML=`<div class="eyebrow">UNHA NOVA ENTRADA NO BLOG...</div><h1>Quen está a escribir?</h1><div class="bubble">Ola! Son Roberto... ou iso creo! 👀<br>Perdín o control do blog por culpa das interferencias espazotemporais.</div><p>Necesito que reparedes o sinal. Temos que falar!</p><p class="small">Facédeo en equipo. Podedes escribir as contas co dedo.</p><div class="seal">📻 ⚡ 🕰️</div><button class="btn green" style="width:100%" onclick="start()">COMEZAR A MISIÓN →</button>`}
function start(){i=0;question()}
function question(){mode='play';answer='';setStatus();const t=tasks[i];panel.innerHTML=`<div class="eyebrow">PEZA ${i+1} DE ${tasks.length} · REPARAR O SINAL</div><h1>${t.title}</h1><div class="problem">${t.story}</div><div class="desk"><div class="deskhead"><span>✏️ CADERNO DE CÁLCULO</span><button class="erase" onclick="clearCanvas()">🧽 BORRAR</button></div><div class="gridpaper"><canvas id="paper" aria-label="Cadriculado para facer as contas co dedo"></canvas></div></div><div class="answerline"><span>RESPOSTA</span><div class="answer" id="answer">?</div></div><div class="pad">${['1','2','3','4','5','6','7','8','9','0','⌫','LIMPAR'].map(k=>`<button class="digit ${Number.isNaN(Number(k))?'alt':''}" onclick="keyPress('${k}')">${k}</button>`).join('')}</div><div class="row"><button class="btn yellow" onclick="hint()">💡 PISTA</button><button class="btn green" onclick="check()">COMPROBAR ✓</button></div><div class="feedback" id="feedback" role="status"></div><div id="hint" class="note" hidden></div>`;setupCanvas()}
function keyPress(k){if(mode!=='play')return;if(k==='LIMPAR')answer='';else if(k==='⌫')answer=answer.slice(0,-1);else if(answer.length<7)answer+=k;$('answer').textContent=answer||'?'}function hint(){$('hint').textContent=tasks[i].hint;$('hint').hidden=false}function check(){if(!answer){$('feedback').textContent='Primeiro escribide a resposta.';return}if(Number(answer)!==tasks[i].a){$('feedback').textContent='Aínda hai interferencias! Revisade as contas.';return}mode='success';panel.innerHTML=`<div class="eyebrow">✓ REPARACIÓN COMPLETADA</div><h1>${tasks[i].done}</h1><div class="seal">${i>=9?'🪐✨':'🔧✨'}</div><div class="bubble">Bo traballo! Unha parte do sinal xa funciona.</div><button class="btn green" style="width:100%" onclick="next()">${i===tasks.length-1?'LER A MENSAXE DE ROBERTO →':'CONTINUAR →'}</button>`;setStatus()}
function next(){i++;i>=tasks.length?ending():question()}
function ending(){mode='end';setStatus();panel.innerHTML=`<div class="eyebrow">📡 MENSAXE RECIBIDA DO FUTURO</div><h1>Roberto está de volta!</h1><div class="bubble">Conseguístelo! Xa podo falar convosco. Pero... non temos moito tempo.</div><p>🚁 Non esquezades agradecer a visita do helicóptero. Foi histórica no cole!</p><p>🎙️ O primeiro reto é <strong>Ecos do Alén</strong>. Sei que ides gañar! 😏</p><p>🎃 Preparádevos para o <strong>Samaín máis histórico</strong> do colexio.</p><p class="small">Teño que marchar. Alguén está seguindo o meu sinal...</p><div class="row"><button class="btn yellow" onclick="intro()">↻ VOLVER XOGAR</button><button class="btn green" onclick="secret()">✉️ ÚLTIMA PISTA</button></div><p class="note" id="secret" hidden>As matemáticas axudáronvos a recuperar unha mensaxe que atravesou o tempo. Pronto precisaremos delas outra vez...</p>`}
function secret(){$('secret').hidden=false}
function setupCanvas(){const canvas=$('paper'),parent=canvas.parentElement,ctx=canvas.getContext('2d');const rect=parent.getBoundingClientRect(),ratio=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.max(1,Math.floor(rect.width*ratio));canvas.height=Math.max(1,Math.floor(rect.height*ratio));ctx.scale(ratio,ratio);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#254c8d';ctx.lineWidth=3.5;let drawing=false,last=null;function coords(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;last=coords(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(last.x+.2,last.y+.2);ctx.stroke()});canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=coords(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});function stop(){drawing=false;last=null}canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop)}function clearCanvas(){const c=$('paper');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}document.addEventListener('keydown',e=>{if(mode!=='play')return;if(/^\d$/.test(e.key))keyPress(e.key);if(e.key==='Backspace')keyPress('⌫');if(e.key==='Enter')check()});intro();
</script></body></html>
